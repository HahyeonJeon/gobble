name: Docker tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build runtime and compatibility launchers
        run: |
          docker build --platform linux/amd64 -f distribution/runtime/Dockerfile --target runtime -t gobble-runtime:ci .
          docker build --platform linux/amd64 -f distribution/runtime/Dockerfile --target launcher-artifacts --output ./dist .
      - name: Common Compose journey without host Go or Gobble
        env:
          GOBBLE_RUNTIME_IMAGE: gobble-runtime:ci
        run: python3 tests/runtime-e2e/smoke.py compose
      - name: Compatibility launcher journey without host Go
        env:
          GOBBLE_RUNTIME_IMAGE: gobble-runtime:ci
        run: python3 tests/runtime-e2e/smoke.py "$PWD/dist/linux-amd64/gobble"

  linux-userspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [golang:1.26-bookworm, golang:1.26-trixie]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build test toolchain
        env:
          GO_IMAGE: ${{ matrix.image }}
        run: docker build --build-arg "GO_IMAGE=$GO_IMAGE" -f tests/docker/Dockerfile -t gobble-tests .
      - name: Hermetic suite without network or daemon access
        run: |
          test_cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          docker run --rm --network=none --cpuset-cpus="$test_cpu" \
            --mount "type=bind,src=$PWD,dst=$PWD" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env "GIT_CONFIG_VALUE_0=$PWD" \
            --workdir "$PWD" gobble-tests

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve dependencies
        run: go mod download all
      - name: Require engine-compatible Docker access
        run: docker info
      - name: Run real Docker publication, failure, and controller recovery tests
        env:
          GOTOOLCHAIN: local
          GOPROXY: off
        run: go test -tags=live -count=1 -run '^(TestRunDocker(Publishes|BadImageContained)|TestDockerLiveControllerDeathRecovery)$' ./internal/engine

  official-assays:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        assay: [rnaseq, wgs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build runtime
        run: docker build --platform linux/amd64 -f distribution/runtime/Dockerfile --target runtime -t gobble-runtime:ci .
      - name: Real assay with official data and unchanged Resume
        env:
          GOBBLE_RUNTIME_IMAGE: gobble-runtime:ci
        run: python3 tests/runtime-e2e/demo.py compose "${{ matrix.assay }}" "$RUNNER_TEMP/assay-evidence"
      - name: Assay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-${{ matrix.assay }}
          path: ${{ runner.temp }}/assay-evidence
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [runtime-install, linux-userspace, docker-smoke, official-assays]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish tested development runtime
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/runtime/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hahyeonjeon/gobble:sha-${{ github.sha }}
            ghcr.io/hahyeonjeon/gobble:develop
          labels: |
            org.opencontainers.image.source=https://github.com/HahyeonJeon/gobble
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Require anonymous download access
        env:
          RUNTIME_REF: ghcr.io/hahyeonjeon/gobble@${{ steps.publish.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker pull --platform linux/amd64 "$RUNTIME_REF"
          docker run --rm "$RUNTIME_REF" --help
      - name: Save exact distribution reference
        env:
          RUNTIME_REF: ghcr.io/hahyeonjeon/gobble@${{ steps.publish.outputs.digest }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          source = Path('distribution/runtime/compose.yaml').read_text()
          Path('compose.yaml').write_text(source.replace('ghcr.io/hahyeonjeon/gobble:develop', os.environ['RUNTIME_REF']))
          Path('runtime-image.txt').write_text(os.environ['RUNTIME_REF'] + '\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: gobble-container-distribution
          path: |
            compose.yaml
            runtime-image.txt
          retention-days: 30
